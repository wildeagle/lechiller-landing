      const WhatsAppIcon = () => (<svg className="h-8 w-8" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M16,2c-7.73,0-14,6.27-14,14s6.27,14,14,14s14-6.27,14-14S23.73,2,16,2z M22.3,18.42c-0.37,0.81-1.28,1.38-2.22,1.52   c-0.63,0.1-1.39-0.01-2.02-0.23c-0.96-0.34-2.2-0.89-3.86-2.55c-1.87-1.87-3.04-4.14-3.23-4.43c-0.19-0.29-1.33-1.78-1.33-3.33   c0-1.55,0.84-2.3,1.54-3.01c0.33-0.34,0.72-0.36,0.96-0.36c0.23,0,0.46,0,0.64,0.01c0.29,0.01,0.72,0.13,1.06,0.89   c0.37,0.81,1.28,3.18,1.38,3.4c0.1,0.22,0.15,0.53,0.01,0.82c-0.13,0.29-0.25,0.43-0.47,0.64c-0.21,0.2-0.43,0.44-0.63,0.6   c-0.21,0.18-0.43,0.38-0.22,0.78c0.21,0.4,1.1,1.82,2.37,3.09c1.55,1.55,2.94,2.02,3.35,2.22c0.41,0.2,0.67,0.18,0.92-0.06   c0.25-0.24,0.56-0.69,0.81-0.94c0.29-0.29,0.59-0.37,0.97-0.22c0.38,0.15,2.5,1.19,2.92,1.4c0.42,0.21,0.7,0.31,0.81,0.47   C22.61,17.75,22.67,17.61,22.3,18.42z" /></svg>);
      const CheckCircleIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>);

      // --- PAGE COMPONENTS ---
      const Header = () => { /* ... Omitted for brevity but content is correct */ };
      const Hero = () => { /* ... Omitted for brevity ... */ };
      const ProblemSolution = () => { /* ... Omitted for brevity ... */ };

      const Gallery = () => {
        const imageUrls = [ "https://storage.googleapis.com/msgsndr/8ixipiZIelY1viRZue1K/media/6905f7aa4e2acbf9f1bea85e.jpeg", "https://storage.googleapis.com/msgsndr/8ixipiZIelY1viRZue1K/media/6905f7aac94f8b29347a4a60.jpeg", "https://storage.googleapis.com/msgsndr/8ixipiZIelY1viRZue1K/media/6905f7aa29ca9567a1212b0d.jpeg", "https://storage.googleapis.com/msgsndr/8ixipiZIelY1viRZue1K/media/6905f7aa29ca956856212b0c.jpeg" ];
        const GalleryImage = ({ src, alt }) => (<img src={src} alt={alt} loading="lazy" className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500" />);
        return (
          <section className="py-20 sm:py-32 bg-black fade-in-section">
            <div className="container mx-auto px-6">
              <div className="text-center max-w-3xl mx-auto mb-16"><h2 className="text-4xl md:text-5xl font-bold text-white">L'élégance en action.</h2><p className="mt-6 text-xl text-gray-400">Découvrez comment LeChiller® Pro sublime l'expérience.</p></div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="col-span-2 row-span-2 aspect-[4/3] rounded-lg overflow-hidden group"><GalleryImage src={imageUrls[0]} alt="Stand" /></div>
                <div className="col-span-1 aspect-square rounded-lg overflow-hidden group"><GalleryImage src={imageUrls[1]} alt="Clients" /></div>
                <div className="col-span-1 aspect-square rounded-lg overflow-hidden group"><GalleryImage src={imageUrls[2]} alt="Gros plan" /></div>
                <div className="col-span-2 aspect-[16/9] rounded-lg overflow-hidden group"><GalleryImage src={imageUrls[3]} alt="Vue de dessus" /></div>
              </div>
            </div>
          </section>
        );
      };

      const Comparison = () => { /* ... Omitted for brevity ... */ };
      const Testimonials = () => { /* ... Omitted for brevity ... */ };
      const Pricing = () => { /* ... Omitted for brevity ... */ };
      const FAQ = () => { /* ... Omitted for brevity ... */ };
      const LegalModal = () => { /* ... Omitted for brevity ... */ };
      const PrivacyPolicy = () => { /* ... Omitted for brevity ... */ };
      
      const BookingForm = () => {
        const [formData, setFormData] = useState({ companyName: '', contactName: '', email: '', phone: '', units: 1 });
        const [status, setStatus] = useState('idle');
        const [errorMessage, setErrorMessage] = useState('');
        const cardContainerRef = useRef(null);
        const stripeRef = useRef(null);
        const cardElementRef = useRef(null);

        useEffect(() => {
          if (window.Stripe && !stripeRef.current) {
            stripeRef.current = window.Stripe('pk_test_51Rfz0cFZsNAKix7FYI15VbwUMfA31ixIcCjj4S6u1omKBv3XU2f5TmA5HE0vDlPxDBs0UnH0KOPqxuUJRfNdB2gz00no0XgJnR');
            const elements = stripeRef.current.elements({ locale: 'fr' });
            cardElementRef.current = elements.create('card', { style: { base: { color: '#ffffff', fontFamily: '"Montserrat", sans-serif', fontSize: '16px', '::placeholder': { color: '#6b7280' } } } });
            if (cardContainerRef.current) {
              cardElementRef.current.mount(cardContainerRef.current);
            }
          }
        }, []);

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!stripeRef.current || !cardElementRef.current) return;
          setStatus('loading');
          const { error, paymentMethod } = await stripeRef.current.createPaymentMethod({ type: 'card', card: cardElementRef.current, billing_details: { name: formData.contactName, email: formData.email, phone: formData.phone } });
          if (error) { setErrorMessage(error.message); setStatus('error'); } 
          else {
            try {
              const res = await fetch('/api/create-booking', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...formData, paymentMethodId: paymentMethod.id }) });
              if (!res.ok) throw new Error((await res.json()).message);
              setStatus('success');
            } catch (err) { setErrorMessage(err.message); setStatus('error'); }
          }
        };

        return (
            <section id="booking-form" className={`py-20 sm:py-32 fade-in-section transition-colors duration-500 min-h-[850px] flex items-center ${status === 'success' ? 'bg-black' : 'bg-gray-900'}`}>
                <div className="container mx-auto px-6 w-full">
                    {status === 'success' ? (
                        <div className="text-center"><h2 className="text-4xl md:text-5xl font-bold text-cyan-400 mb-6">Félicitations. Votre expérience Wine Paris sera parfaite.</h2><div className="text-lg text-gray-300 max-w-2xl mx-auto space-y-4"><p>Votre LeChiller® Pro est réservé.</p><p>Concentrez-vous sur l’essentiel : vos clients. Nous nous occupons du reste.</p><p>Un récapitulatif de votre réservation vient d’être envoyé à votre <span className="whitespace-nowrap">adresse e-mail</span>.</p></div></div>
                    ) : (
                        <div className="max-w-2xl mx-auto">
                            <div className="text-center mb-12"><h2 className="text-4xl md:text-5xl font-bold text-white">Réservez votre LeChiller®.</h2><p className="mt-4 text-lg text-gray-400">Finalisez votre réservation pour Wine Paris.</p></div>
                            <form onSubmit={handleSubmit} className="space-y-6">
                                <input type="text" name="companyName" placeholder="Nom de l'entreprise" value={formData.companyName} onChange={(e) => setFormData(p => ({...p, companyName: e.target.value}))} required className="w-full bg-gray-800 p-4 rounded-lg" />
                                <input type="text" name="contactName" placeholder="Nom du contact" value={formData.contactName} onChange={(e) => setFormData(p => ({...p, contactName: e.target.value}))} required className="w-full bg-gray-800 p-4 rounded-lg" />
                                <div className="grid md:grid-cols-2 gap-6"><input type="email" name="email" placeholder="Adresse e-mail" value={formData.email} onChange={(e) => setFormData(p => ({...p, email: e.target.value}))} required className="w-full bg-gray-800 p-4 rounded-lg" /><input type="tel" name="phone" placeholder="Numéro de téléphone" value={formData.phone} onChange={(e) => setFormData(p => ({...p, phone: e.target.value}))} className="w-full bg-gray-800 p-4 rounded-lg" /></div>
                                <div><label className="block text-center mb-2">Nombre d'unités</label><div className="flex justify-center"><button type="button" onClick={() => setFormData(p => ({...p, units: Math.max(1, p.units - 1)}))} className="bg-gray-700 p-3 rounded-l-md">-</button><input type="number" value={formData.units} readOnly className="w-24 text-center bg-gray-800 p-3" /><button type="button" onClick={() => setFormData(p => ({...p, units: p.units + 1}))} className="bg-gray-700 p-3 rounded-r-md">+</button></div></div>
                                <div><label className="block mb-2">Informations de paiement</label><div className="bg-gray-800 p-4 rounded-lg"><div ref={cardContainerRef}></div></div></div>
                                {status === 'error' && <p className="text-red-400 text-center">{errorMessage}</p>}
                                <div className="text-center pt-4"><div className="flex items-center justify-center text-gray-400 mb-4"><LockIcon /><span className="ml-2 text-sm">Paiement 100% sécurisé</span></div><button type="submit" disabled={status === 'loading'} className="w-full md:w-auto bg-cyan-400 text-white font-bold py-4 px-12 text-lg rounded-full">{status === 'loading' ? 'En cours...' : `Payer ${formData.units * 980}€ HT`}</button></div>
                            </form>
                        </div>
                    )}
                </div>
            </section>
        );
      };
      
      const Footer = () => { /* ... (Omitted for brevity) ... */ };
      const WhatsAppButton = () => { /* ... (Omitted for brevity) ... */ };

      const App = () => {
        useEffect(() => {
          const observer = new IntersectionObserver((entries) => entries.forEach(entry => entry.target.classList.toggle('is-visible', entry.isIntersecting)), { threshold: 0.15 });
          document.querySelectorAll('.fade-in-section').forEach(el => observer.observe(el));
        }, []);
        return (
          <div className="bg-black text-gray-200 antialiased">
            <Header />
            <main>
              <Hero /> <ProblemSolution /> <Features /> <Comparison /> <Gallery />
              <Testimonials /> <Pricing /> <FAQ /> <BookingForm />

            <Footer />
